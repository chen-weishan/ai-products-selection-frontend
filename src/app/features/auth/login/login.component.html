<main class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>選品策略系統</mat-card-title>
      <mat-card-subtitle>帳號登入</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p class="login-hint">請使用系統帳號登入。</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          @if (form.controls.email.hasError('required')) {
            <mat-error>請輸入 Email</mat-error>
          } @else if (form.controls.email.hasError('email')) {
            <mat-error>Email 格式不正確</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>密碼</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
          @if (form.controls.password.hasError('required')) {
            <mat-error>請輸入密碼</mat-error>
          }
        </mat-form-field>

        @if (loginError()) {
          <p class="login-error" role="alert">{{ loginError() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
          {{ submitting() ? '登入中…' : '登入' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
