<div class="dialog-container">
  <h2 mat-dialog-title class="dialog-title">
    {{ data.title || '系統確認' }}
  </h2>

  <mat-dialog-content class="dialog-content">
    <p>{{ data.message || '是否執行此操作' }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions" align="center">
    <button mat-button type="button" (click)="onCancel()">
      {{ data.cancelText || '取消' }}
    </button>
    <button
      mat-flat-button
      [color]="data.isDanger ? 'warn' : 'primary'"
      type="button"
      (click)="onConfirm()"
    >
      {{ data.confirmText || '確認' }}
    </button>
  </mat-dialog-actions>
</div>
